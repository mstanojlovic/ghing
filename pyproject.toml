[project]
name = "py-pure-client"
dynamic = ["version"]
description = "testing gha for ppc"
readme = "README.md"
license = {file = "LICENSE.txt"}
requires-python = ">=3.8"
dependencies = [
    'certifi >= 2024.07.04',
    'python_dateutil >=2.8.2',
    'setuptools >= 70.0.0, < 81.0.0; python_version <= "3.10"',
    'setuptools >= 70.0.0; python_version > "3.10"',
    'urllib3 >= 1.26.17',
    'paramiko >= 3.4.0',
    'pyjwt >=2.0.0',
    'pydantic >= 1.10.14'
]

[tool.setuptools.dynamic]
version = {attr = "pypureclient._version.__version__"}
