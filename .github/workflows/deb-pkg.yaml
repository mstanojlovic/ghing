name: "Build Debian Package"

on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-deb:
    runs-on: ubuntu-24.04

    name: build deb
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install system packaging tools
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          apt-get update -qq
          apt-get install -qqy build-essential debhelper dh-python dpkg-dev fakeroot lintian python3-all python3-dateutil python3-jwt python3-paramiko python3-pip python3-pydantic python3-setuptools python3-urllib3 


      # - name: Get version
      #   run: |
      #     VERSION=$(python3 -c "from pypureclient._version import __version__; print(__version__)")
      #     echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install stdeb
        run: |
          pip3 install -q stdeb setuptools --break-system-packages || pip3 install -q stdeb setuptools

      - name: Patch stdeb
        run: |
          STDEB_DIR=$(python3 -c "import stdeb; import os; print(os.path.dirname(stdeb.__file__))")
          # Fix the SafeConfigParser removal (Python 3.12+)
          find "$STDEB_DIR" -name "*.py" -exec sed -i 's/SafeConfigParser/ConfigParser/g' {} +
          # Fix the readfp removal (Python 3.12+)
          find "$STDEB_DIR" -name "*.py" -exec sed -i 's/\.readfp(/.read_file(/g' {} +

      - name: Concatenate license to copyright
        run: |
          cat LICENSE.txt >> debian/copyright

      - name: Generate .deb package
        shell: bash
        run: |
          cat <<EOF > stdeb.cfg
          [DEFAULT]
          Maintainer = Everpuretest <test@everpuredata.com>
          Depends3 = python3-pydantic, python3-paramiko, python3-urllib3, python3-dateutil, python3-jwt
          Build-Depends = python3-pydantic, python3-paramiko, python3-urllib3, python3-dateutil, python3-jwt
          Copyright-File = debian/copyright
          EOF

          DEB_BUILD_OPTIONS=nocheck python3 setup.py --quiet --command-packages=stdeb.command bdist_deb > bdist_deb.log 2>&1 || { cat bdist_deb.log; exit 1; }

      - name: Run lintian
        shell: bash
        run: |
          find ./deb_dist -name "*.deb" -exec lintian -i -I --allow-root {} +

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: deb-package
          overwrite: true
          retention-days: 5
          path: deb_dist/**/*.deb

  test-deb:
    runs-on: [ small ]
    needs: build-deb
    # We only test on Ubuntu versions that apply the PEP 668 standard (24.04 and 26.04).
    # Older versions (e.g. 20.04, 22.04) are not supported as they lack PEP 668 enforcement
    # and their older lintian/dpkg tools do not fully support the zstd-compressed .deb
    # archives generated by ubuntu:latest (24.04+).
    # Customers could use pip install globally anyway, so this should be fine.
    strategy:
      matrix:
        ubuntu-version: [ '24.04', '26.04' ]
    container:
      image: ubuntu-${{ matrix.ubuntu-version }}
      options: --user root

    name: test deb on ubuntu ${{ matrix.ubuntu-version }}
    timeout-minutes: 5

    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: deb-package
          path: deb-package

      - name: Test DEB installation and import
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          apt-get update -qq
          find ./deb-package -name "*.deb" -exec apt-get install -y {} +
          python3 -c "import pypureclient; print('Success! py-pure-client version:', pypureclient.__version__)"
