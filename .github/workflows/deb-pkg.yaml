name: "Build Debian Package"

on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    name: build deb
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install system packaging tools
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy build-essential debhelper dh-python dpkg-dev fakeroot lintian python3-all python3-dateutil python3-jwt python3-paramiko python3-pip python3-pydantic python3-setuptools python3-urllib3 

      - name: Install stdeb
        run: |
          sudo pip3 install -q stdeb setuptools --break-system-packages

      - name: Patch stdeb
        run: |
          STDEB_DIR=$(python3 -c "import stdeb; import os; print(os.path.dirname(stdeb.__file__))")
          # Fix the SafeConfigParser and readfp removals (Python 3.12+ on Ubuntu 24.04)
          sudo find "$STDEB_DIR" -name "*.py" -exec sed -i 's/SafeConfigParser/ConfigParser/g' {} +
          sudo find "$STDEB_DIR" -name "*.py" -exec sed -i 's/\.readfp(/.read_file(/g' {} +

      - name: Concatenate license to copyright
        run: |
          mkdir -p debian
          cat LICENSE.txt >> debian/copyright

      - name: Generate .deb package
        shell: bash
        run: |
          cat <<EOF > stdeb.cfg
          [DEFAULT]
          Maintainer = Everpuretest <test@everpuredata.com>
          Depends3 = python3-pydantic, python3-paramiko, python3-urllib3, python3-dateutil, python3-jwt
          Build-Depends = python3-pydantic, python3-paramiko, python3-urllib3, python3-dateutil, python3-jwt
          Copyright-File = debian/copyright
          EOF

          DEB_BUILD_OPTIONS=nocheck python3 setup.py --quiet --command-packages=stdeb.command bdist_deb > bdist_deb.log 2>&1 || { cat bdist_deb.log; exit 1; }

      - name: Run lintian
        shell: bash
        run: |
          find ./deb_dist -name "*.deb" -exec lintian -i -I --allow-root {} +

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          overwrite: true
          retention-days: 5
          path: deb_dist/**/*.deb

  test-deb:
    runs-on: ubuntu-24.04
    needs: build-deb
    strategy:
      matrix:
        ubuntu-version: [ '24.04', '26.04' ]
    container:
      image: ubuntu:${{ matrix.ubuntu-version }}
      options: --user root

    name: test deb on ubuntu ${{ matrix.ubuntu-version }}
    timeout-minutes: 5

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: deb-package

      - name: Test DEB installation and import
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          apt-get update -qq
          find ./deb-package -name "*.deb" -exec apt-get install -y {} +
          python3 -c "import pypureclient; print('Success! py-pure-client version:', pypureclient.__version__)"